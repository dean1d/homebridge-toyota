<div class="container-fluid">
  <form id="login-form" class="mb-3">
    <label class="form-label" for="email">Toyota account email</label>
    <input class="form-control mb-2" id="email" type="email" autocomplete="username" required>
    <label class="form-label" for="password">Toyota password</label>
    <input class="form-control mb-2" id="password" type="password" autocomplete="current-password">
    <button class="btn btn-primary" type="submit">Sign in to Toyota</button>
  </form>
  <form id="code-form" class="mb-3" hidden>
    <label class="form-label" for="code">Toyota verification code</label>
    <input class="form-control mb-2" id="code" autocomplete="one-time-code" required>
    <button class="btn btn-primary" type="submit">Verify code</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <form id="settings-form">
    <datalist id="vehicles"></datalist>
    <div id="cars"></div>
    <button class="btn btn-secondary me-2" id="add-car" type="button">Add vehicle</button>
    <button class="btn btn-primary" type="submit" disabled>Save Toyota settings</button>
  </form>
  <template id="car-template">
    <fieldset class="card card-body mb-3">
      <legend class="fs-6">Vehicle</legend>
      <label class="form-label">Name in Apple Home
        <input class="form-control mb-2" data-field="name" required>
      </label>
      <label class="form-label">Vehicle VIN
        <input class="form-control mb-3" data-field="vin" list="vehicles" maxlength="17" pattern="[A-HJ-NPR-Z0-9a-hj-npr-z0-9]{17}" required>
      </label>
      <fieldset class="mb-2">
        <legend class="fs-6">Show in Apple Home</legend>
        <div data-options></div>
      </fieldset>
      <div><button class="btn btn-outline-danger btn-sm" data-remove type="button">Remove vehicle</button></div>
    </fieldset>
  </template>
</div>
<script src="settings.js"></script>
